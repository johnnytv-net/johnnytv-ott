name: Build JohnnyTV OTT
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-ott
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # First run after a source.zip upload: replace the old tree with the zip's contents.
      - name: Unpack the source bundle
        run: |
          if [ -f source.zip ]; then
            mkdir /tmp/new && unzip -q -o source.zip -d /tmp/new
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
            cp -a /tmp/new/. .
            git config user.name "JohnnyTV build"
            git config user.email "build@johnnytv.invalid"
            git add -A
            git commit -m "Unpack app source [skip ci]"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > johnnytv.jks
          else
            echo "::warning::No KEYSTORE_B64 secret - generating a one-off key; updates will not install over this build."
            keytool -genkeypair -keystore johnnytv.jks -alias johnnytv -keyalg RSA -keysize 2048 -validity 10000 -storepass johnnytv-signing -keypass johnnytv-signing -dname "CN=JohnnyTV OTT"
          fi
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" JohnnyTV-OTT.apk
          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" --latest --title "JohnnyTV OTT $VERSION" --notes "Version $VERSION" JohnnyTV-OTT.apk
