name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - name: Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ott.jks;
          else keytool -genkeypair -v -keystore ott.jks -alias ott -keyalg RSA -keysize 2048 -validity 10000 -storepass johnnytvott -keypass johnnytvott -dname "CN=JohnnyTV OTT"; fi
      - name: Build
        run: gradle assembleRelease --no-daemon
        env: { KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD || 'johnnytvott' }}" }
      - name: Version
        id: v
        run: echo "name=v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> $GITHUB_OUTPUT
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.name }}
          name: JohnnyTV OTT ${{ steps.v.outputs.name }}
          files: app/build/outputs/apk/release/app-release.apk
